<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250">
  <!-- RGUKT human figure — elegant tapered rendering (star/X pose) -->
  <!-- Head -->
  <circle cx="100" cy="30" r="21" fill="#8b0000"/>
  <!-- Left arm: tapered sweep up-left -->
  <path fill="#8b0000" d="M 96.4 86.3 Q 48.1 49.8 12.3 20.5 L 15.7 15.5 Q 55.9 38.2 107.6 69.7 Z"/>
  <!-- Right arm: tapered sweep up-right -->
  <path fill="#8b0000" d="M 103.9 86.1 Q 154.1 45.7 187.8 16.4 L 184.2 11.6 Q 145.9 34.3 92.1 69.9 Z"/>
  <!-- Torso -->
  <line x1="100" y1="76" x2="100" y2="130" stroke="#8b0000" stroke-width="24" stroke-linecap="round"/>
  <!-- Left leg: tapering curve down-left -->
  <path fill="#8b0000" d="M 91.9 120.6 Q 49.7 171.1 20.6 223.8 L 27.4 228.2 Q 62.3 180.9 108.1 135.4 Z"/>
  <!-- Right leg: broad flowing curve down-right -->
  <path fill="#8b0000" d="M 92.9 138.9 Q 145.4 167.6 177.4 232 L 186.6 228 Q 158.6 156.4 107.1 117.1 Z"/>
</svg>
