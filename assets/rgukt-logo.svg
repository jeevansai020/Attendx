<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- RGUKT Human figure - star/X pose -->
  <!-- Head -->
  <circle cx="100" cy="30" r="24" fill="#8b0000"/>
  <!-- Left arm (diagonal up-left) -->
  <line x1="100" y1="78" x2="18" y2="18" stroke="#8b0000" stroke-width="20" stroke-linecap="round"/>
  <!-- Right arm (diagonal up-right) -->
  <line x1="100" y1="78" x2="182" y2="18" stroke="#8b0000" stroke-width="20" stroke-linecap="round"/>
  <!-- Torso -->
  <line x1="100" y1="78" x2="100" y2="138" stroke="#8b0000" stroke-width="20" stroke-linecap="round"/>
  <!-- Left leg (diagonal down-left) -->
  <line x1="100" y1="138" x2="28" y2="224" stroke="#8b0000" stroke-width="20" stroke-linecap="round"/>
  <!-- Right leg (diagonal down-right) -->
  <line x1="100" y1="138" x2="172" y2="224" stroke="#8b0000" stroke-width="20" stroke-linecap="round"/>
</svg>
